<div class="title">
  <h1>
    <strong>{{ title }}</strong>
  </h1>
</div>

<section>
  <div class="container mt-4">
    <!-- Formulario y lista de tareas -->
    <app-task-form (taskAdded)="onTaskAdded($event)"></app-task-form>
    <!-- Filtro de tareas -->
    <app-task-filter (filterChange)="onFilterChange($event)"></app-task-filter>
    <app-task-list [filter]="currentFilter"></app-task-list>
  </div>
</section>
