<div class="container mt-4">
  <h2>Agregar Tarea</h2>
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Título</label>
      <input
        type="text"
        class="form-control"
        id="title"
        formControlName="title"
        [ngClass]="{
          'is-invalid':
            taskForm.get('title')?.invalid && taskForm.get('title')?.touched
        }"
      />
      <div
        *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched"
        class="invalid-feedback"
      >
        <div *ngIf="taskForm.get('title')?.errors?.['required']">
          El título es requerido.
        </div>
        <div *ngIf="taskForm.get('title')?.errors?.['minlength']">
          El título debe tener al menos 6 caracteres.
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Descripción</label>
      <textarea
        class="form-control"
        id="description"
        formControlName="description"
        [ngClass]="{
          'is-invalid':
            taskForm.get('description')?.invalid &&
            taskForm.get('description')?.touched
        }"
      ></textarea>
      <div
        *ngIf="
          taskForm.get('description')?.invalid &&
          taskForm.get('description')?.touched
        "
        class="invalid-feedback"
      >
        <div *ngIf="taskForm.get('description')?.errors?.['required']">
          La descripción es requerida.
        </div>
      </div>
    </div>

    <div class="form-check">
      <input
        type="checkbox"
        class="form-check-input"
        id="completed"
        formControlName="completed"
      />
      <label class="form-check-label" for="completed">Completada</label>
    </div>
    <button
      type="submit"
      class="btn btn-primary mt-3"
      [disabled]="taskForm.invalid"
    >
      Agregar Tarea
    </button>
  </form>
</div>
